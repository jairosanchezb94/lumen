<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4f1ea;
    --ink-dim: rgba(244, 241, 234, .56);
    --ink-faint: rgba(244, 241, 234, .28);
    --night: #06070a;
    --aura: #3a2a6b;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--night); color: var(--ink);
    font-family: "Onest", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* El lienzo se diseña a 1920x1080 y se escala a la pantalla real */
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden;
  }

  /* ---------- atmósfera ---------- */
  .aura {
    position: absolute; inset: -20%;
    transition: opacity 900ms var(--ease);
    will-change: opacity;
  }
  .aura::before, .aura::after {
    content: ""; position: absolute; border-radius: 50%;
    background: var(--c, #333); filter: blur(140px);
  }
  .aura::before { width: 60%; height: 70%; left: 48%; top: 2%; opacity: .55; }
  .aura::after  { width: 45%; height: 50%; left: 8%;  top: 55%; opacity: .22; }
  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 30% 20%, transparent 40%, rgba(0,0,0,.65) 100%),
      linear-gradient(180deg, rgba(6,7,10,0) 55%, rgba(6,7,10,.85) 100%);
  }
  .grain {
    position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- cabecera ---------- */
  header {
    position: absolute; left: 120px; right: 120px; top: 84px;
    transition: opacity 400ms var(--ease);
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .clock {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 168px; line-height: .82; letter-spacing: -4px;
    font-variant-numeric: tabular-nums;
  }
  .clock .sep { opacity: .45; animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .date {
    margin-top: 22px; font-size: 26px; font-weight: 500;
    color: var(--ink-dim); letter-spacing: .2px;
  }
  .date::first-letter { text-transform: uppercase; }
  .greet { text-align: right; }
  .greet .hello {
    font-family: "Instrument Serif", Georgia, serif; font-style: italic;
    font-size: 54px; line-height: 1;
  }
  .greet .meta { margin-top: 12px; font-size: 20px; color: var(--ink-faint); letter-spacing: 3px; text-transform: uppercase; }

  /* ---------- contenido desplazable ---------- */
  #scroller {
    position: absolute; left: 0; right: 0; top: 400px;
    transition: transform 520ms var(--ease);
  }
  .label {
    margin: 0 0 22px 120px; font-size: 20px; font-weight: 600;
    letter-spacing: 3.5px; text-transform: uppercase; color: var(--ink-faint);
  }

  /* dock de favoritos: una repisa de cristal */
  .shelf {
    position: relative; margin: 0 92px; padding: 28px;
    border-radius: 44px;
    background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.035));
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 40px 80px -40px rgba(0,0,0,.8);
    -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
  }
  .row { display: flex; gap: 28px; }
  .shelf { overflow: hidden; }
  .shelf .row { min-height: 190px; padding: 14px 18px; margin: -14px -18px; transition: transform 420ms var(--ease); }
  .focus-name {
    height: 56px; margin: 26px 0 30px 120px;
    font-size: 30px; font-weight: 500; letter-spacing: .2px;
    display: flex; align-items: center; gap: 18px;
  }
  .focus-name .pin {
    font-size: 16px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--ink-dim); padding: 7px 14px; border-radius: 99px;
    border: 1px solid var(--ink-faint);
  }

  .grid { display: flex; flex-wrap: wrap; gap: 30px 28px; margin: 0 120px; }

  /* ---------- tiles ---------- */
  .tile {
    position: relative; flex: none; width: 306px; height: 190px;
    border-radius: 30px; overflow: hidden;
    background: var(--bg, #1b1c22);
    transform: translateZ(0);
    transition: transform 320ms var(--ease), box-shadow 320ms var(--ease), filter 320ms var(--ease);
    box-shadow: 0 10px 30px -12px rgba(0,0,0,.7);
  }
  .grid .tile { width: 254px; height: 158px; border-radius: 26px; }
  .tile .logo {
    position: absolute; left: 50%; top: 50%; width: 46%; height: 42%;
    transform: translate(-50%, -50%);
    background: var(--fg, #fff);
    -webkit-mask: var(--mask) center / contain no-repeat;
            mask: var(--mask) center / contain no-repeat;
  }
  .tile img.icon {
    position: absolute; left: 50%; top: 50%; width: 46%; height: 62%;
    transform: translate(-50%, -50%); object-fit: contain;
  }
  .tile .word {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 0 22px; text-align: center;
    font-family: "Instrument Serif", Georgia, serif; font-size: 44px; line-height: 1; color: var(--fg, #fff);
  }
  .grid .tile .word { font-size: 36px; }
  .tile::after { /* brillo que barre la tile al enfocarla */
    content: ""; position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 48%, transparent 62%);
    transform: translateX(-60%);
  }
  .tile::before { /* luz superior permanente, como un icono de tvOS */
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 45%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
  }
  .tile.focus {
    transform: translateY(-10px) scale(1.12);
    box-shadow: 0 40px 60px -22px rgba(0,0,0,.9), 0 0 0 4px rgba(255,255,255,.9);
    z-index: 2;
  }
  .tile.focus::after { animation: sheen 1100ms var(--ease) 120ms both; }
  @keyframes sheen { 0% { opacity: 0; transform: translateX(-60%); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(60%); } }
  body.dim .tile:not(.focus) { filter: brightness(.72) saturate(.85); }
  .tile .star {
    position: absolute; right: 14px; top: 12px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center;
    font-size: 15px; color: #ffd76a;
  }
  .grid .tile.fav .star { display: flex; }

  /* ---------- entrada ---------- */
  .rise { animation: rise 900ms var(--ease) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }

  /* ---------- pie y avisos ---------- */
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 170px; pointer-events: none;
    background: linear-gradient(180deg, rgba(6,7,10,0), rgba(6,7,10,.92) 70%);
  }
  footer {
    position: absolute; left: 120px; right: 120px; bottom: 46px;
    display: flex; justify-content: space-between;
    font-size: 19px; color: var(--ink-faint);
  }
  footer b { color: var(--ink-dim); font-weight: 600; }
  .toast {
    position: absolute; left: 50%; bottom: 110px; transform: translate(-50%, 20px);
    padding: 18px 34px; border-radius: 99px; font-size: 24px; font-weight: 500;
    background: rgba(20,21,26,.82); border: 1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    opacity: 0; transition: opacity 260ms var(--ease), transform 260ms var(--ease);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .hold-ring {
    position: absolute; inset: -6px; border-radius: 34px; pointer-events: none;
    border: 4px solid #ffd76a; opacity: 0; transition: opacity 120ms;
  }
  .tile.holding .hold-ring { opacity: 1; animation: hold 600ms linear both; }
  @keyframes hold { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
</style>
</head>
<body class="dim">
<div id="stage">
  <div class="aura" id="auraA"></div>
  <div class="aura" id="auraB" style="opacity:0"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <header class="rise">
    <div>
      <div class="clock" id="clock">00<span class="sep">:</span>00</div>
      <div class="date" id="date"></div>
    </div>
    <div class="greet">
      <div class="hello" id="hello">Hola, Jairo</div>
      <div class="meta">Neo QLED · Salón</div>
    </div>
  </header>

  <div id="scroller">
    <div class="label rise" style="animation-delay:80ms">Favoritos</div>
    <div class="shelf rise" style="animation-delay:140ms"><div class="row" id="favRow"></div></div>
    <div class="focus-name" id="focusName"></div>
    <div class="label rise" style="animation-delay:220ms">Todas las apps</div>
    <div class="grid rise" id="allGrid" style="animation-delay:280ms"></div>
  </div>

  <div class="floor"></div>
  <footer>
    <span><b>OK</b> abrir &nbsp;·&nbsp; <b>Mantén OK</b> fijar o quitar de favoritos</span>
    <span id="count"></span>
  </footer>
  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';

/* ---------- escala 1920x1080 → pantalla ---------- */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  const stage = document.getElementById('stage');
  stage.style.transform = 'scale(' + s + ')';
  stage.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
  stage.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- marcas conocidas ---------- */
const ICONS = 'https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/';
const BRANDS = [
  { re: /netflix/,              icon: 'netflix',     bg: '#0b0b0c', fg: '#e50914' },
  { re: /youtube\s*kids/,       icon: 'youtubekids', bg: '#ff2a2a', fg: '#fff' },
  { re: /youtube/,              icon: 'youtube',     bg: '#ff0000', fg: '#fff' },
  { re: /prime\s*video|amazon\s*prime/, icon: 'primevideo', bg: '#0f171e', fg: '#1fb6ff' },
  { re: /disney/,               word: 'Disney+',     bg: 'linear-gradient(140deg,#0a1a4f,#1243c6)', fg: '#fff' },
  { re: /apple\s*tv/,           icon: 'appletv',     bg: '#0a0a0a', fg: '#fff' },
  { re: /^max$|hbo/,            word: 'max',         bg: 'linear-gradient(140deg,#001a9e,#0b3cff)', fg: '#fff' },
  { re: /movistar/,             icon: 'movistar',    bg: '#0b9ff0', fg: '#fff' },
  { re: /spotify/,              icon: 'spotify',     bg: '#121212', fg: '#1ed760' },
  { re: /twitch/,               icon: 'twitch',      bg: '#9146ff', fg: '#fff' },
  { re: /plex/,                 icon: 'plex',        bg: '#1f1f1f', fg: '#ebaf00' },
  { re: /crunchyroll/,          icon: 'crunchyroll', bg: '#f47521', fg: '#fff' },
  { re: /dazn/,                 icon: 'dazn',        bg: '#0c0c0c', fg: '#f8f8f5' },
  { re: /steam/,                icon: 'steam',       bg: '#171a21', fg: '#fff' },
  { re: /playstation|ps remote/, icon: 'playstation', bg: '#0070d1', fg: '#fff' },
  { re: /tidal/,                icon: 'tidal',       bg: '#000',    fg: '#fff' },
  { re: /amazon\s*music/,       icon: 'amazonmusic', bg: '#0d1b2a', fg: '#25d1da' },
  { re: /smartthings/,          icon: 'smartthings', bg: '#15bfff', fg: '#fff' },
  { re: /samsung/,              icon: 'samsung',     bg: '#1428a0', fg: '#fff' },
  { re: /skyshowtime/,          word: 'SkyShowtime', bg: '#101820', fg: '#fff' },
  { re: /filmin/,               word: 'Filmin',      bg: '#ff2d55', fg: '#fff' },
  { re: /rtve/,                 word: 'RTVE Play',   bg: '#d4001e', fg: '#fff' },
  { re: /atres/,                word: 'atresplayer', bg: '#ff6a00', fg: '#fff' },
  { re: /mitele/,               word: 'mitele',      bg: '#1d1d3a', fg: '#fff' },
  { re: /pluto/,                word: 'Pluto TV',    bg: '#111',    fg: '#fff38c' },
  { re: /rakuten/,              word: 'Rakuten TV',  bg: '#bf0000', fg: '#fff' }
];
const DEFAULT_FAVS = [/netflix/, /youtube(?!\s*kids)/, /prime/, /disney/, /apple\s*tv/, /^max$|hbo/, /movistar/, /spotify/];
const PALETTE = ['#2b3a67', '#5b2a4f', '#1f4d4a', '#5a3d1e', '#3b2f6b', '#204060'];

function brandFor(name) {
  const n = name.toLowerCase();
  return BRANDS.find(b => b.re.test(n)) || null;
}

/* ---------- descubrir apps instaladas ---------- */
const HIDE_ID = /xvvl3S1bvH|^org\.tizen\.|^com\.samsung\.tv\./i;
const HIDE_NAME = /tizenbrew|widget|service|installer|manual|ajustes|settings|^$/i;

function discover() {
  return new Promise(resolve => {
    const t = window.tizen;
    if (!t || !t.application || !t.application.getAppsInfo) return resolve(null);
    try {
      t.application.getAppsInfo(list => {
        const seen = new Set();
        const apps = [];
        for (const a of list) {
          if (a.show === false || HIDE_ID.test(a.id) || HIDE_NAME.test(a.name || '')) continue;
          const key = a.name.trim().toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);
          apps.push({ id: a.id, name: a.name.trim(), iconPath: a.iconPath || null });
        }
        resolve(apps);
      }, () => resolve(null));
    } catch (e) { resolve(null); }
  });
}

// Vista previa en el navegador del Mac
const PREVIEW = ['Netflix', 'YouTube', 'Prime Video', 'Disney+', 'Apple TV', 'Max', 'Movistar Plus+', 'Spotify',
  'DAZN', 'Twitch', 'Plex', 'RTVE Play', 'atresplayer', 'SkyShowtime', 'Filmin', 'Steam Link', 'SmartThings', 'Samsung TV Plus']
  .map((name, i) => ({ id: 'preview.' + i, name, iconPath: null }));

/* ---------- favoritos guardados ---------- */
const STORE = 'inicio.favs.v1';
function loadFavs(apps) {
  let ids = null;
  try { ids = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
  if (Array.isArray(ids)) return ids.filter(id => apps.some(a => a.id === id));
  const out = [];
  for (const re of DEFAULT_FAVS) {
    const hit = apps.find(a => re.test(a.name.toLowerCase()) && !out.includes(a.id));
    if (hit) out.push(hit.id);
  }
  return out;
}
function saveFavs() { try { localStorage.setItem(STORE, JSON.stringify(favs)); } catch (e) {} }

/* ---------- pintar ---------- */
let apps = [], favs = [], rows = [[], []], focus = { r: 0, c: 0 };
const els = new Map(); // "r:c" -> tile

function tileFor(app, i) {
  const b = brandFor(app.name);
  const el = document.createElement('div');
  el.className = 'tile';
  el.style.setProperty('--bg', b ? b.bg : 'linear-gradient(140deg,' + PALETTE[i % PALETTE.length] + ',#111318)');
  el.style.setProperty('--fg', b ? b.fg : '#fff');
  if (b && b.icon) {
    const logo = document.createElement('div');
    logo.className = 'logo';
    logo.style.setProperty('--mask', 'url(' + ICONS + b.icon + '.svg)');
    el.appendChild(logo);
  } else if (!b && app.iconPath) {
    const img = document.createElement('img');
    img.className = 'icon';
    img.src = app.iconPath.indexOf('://') > 0 ? app.iconPath : 'file://' + app.iconPath;
    img.onerror = () => { img.remove(); el.appendChild(word(app.name)); };
    el.appendChild(img);
  } else {
    el.appendChild(word(b && b.word ? b.word : app.name));
  }
  const star = document.createElement('div'); star.className = 'star'; star.textContent = '★';
  const ring = document.createElement('div'); ring.className = 'hold-ring';
  el.append(star, ring);
  return el;
}
function word(text) {
  const w = document.createElement('div'); w.className = 'word'; w.textContent = text; return w;
}
function auraColor(app) {
  const b = brandFor(app.name);
  if (!b) return '#3a2a6b';
  const m = /#([0-9a-f]{6}|[0-9a-f]{3})/i.exec(b.fg !== '#fff' ? b.fg : b.bg);
  return m ? m[0] : '#3a2a6b';
}

function render() {
  const favRow = document.getElementById('favRow');
  const grid = document.getElementById('allGrid');
  favRow.innerHTML = ''; grid.innerHTML = ''; els.clear();
  const favApps = favs.map(id => apps.find(a => a.id === id)).filter(Boolean);
  rows = [favApps, apps];
  favApps.forEach((a, c) => { const t = tileFor(a, apps.indexOf(a)); favRow.appendChild(t); els.set('0:' + c, t); });
  apps.forEach((a, c) => {
    const t = tileFor(a, c);
    if (favs.includes(a.id)) t.classList.add('fav');
    grid.appendChild(t); els.set('1:' + c, t);
  });
  document.getElementById('count').textContent = apps.length + ' apps';
  if (!rows[focus.r].length) focus = { r: rows[0].length ? 0 : 1, c: 0 };
  focus.c = Math.min(focus.c, rows[focus.r].length - 1);
  paint();
}

let auraFlip = false;
function paint() {
  els.forEach(t => t.classList.remove('focus'));
  const t = els.get(focus.r + ':' + focus.c);
  const app = rows[focus.r][focus.c];
  if (!t || !app) return;
  t.classList.add('focus');

  // nombre bajo el dock
  const fn = document.getElementById('focusName');
  fn.innerHTML = '';
  fn.append(document.createTextNode(app.name));
  if (favs.includes(app.id)) {
    const p = document.createElement('span'); p.className = 'pin'; p.textContent = 'Favorito'; fn.appendChild(p);
  }

  // color ambiental con fundido cruzado
  const a = document.getElementById(auraFlip ? 'auraA' : 'auraB');
  const b = document.getElementById(auraFlip ? 'auraB' : 'auraA');
  a.style.setProperty('--c', auraColor(app));
  a.style.opacity = 1; b.style.opacity = 0;
  auraFlip = !auraFlip;

  // desplazamiento vertical dentro de la cuadrícula
  const scroller = document.getElementById('scroller');
  let y = 0;
  if (focus.r === 1) {
    const perRow = Math.max(1, Math.floor((1920 - 240 + 28) / (254 + 28)));
    const line = Math.floor(focus.c / perRow);
    y = Math.max(0, 140 + line * 188 - 120);
  }
  scroller.style.transform = 'translateY(' + (-y) + 'px)';
  document.querySelector('header').style.opacity = y > 0 ? 0 : 1;

  // desplazamiento horizontal del dock para que la tile enfocada se vea entera
  const favRow = document.getElementById('favRow');
  const visible = 1920 - 2 * 92 - 2 * 28;
  const step = 306 + 28;
  const over = Math.max(0, rows[0].length * step - 28 - visible);
  const x = focus.r === 0 ? Math.min(over, Math.max(0, focus.c * step - visible + step + 40)) : 0;
  favRow.style.transform = 'translateX(' + (-x) + 'px)';
}

/* ---------- acciones ---------- */
function launch(app) {
  if (window.tizen && tizen.application && !app.id.startsWith('preview.')) {
    try { tizen.application.launch(app.id, null, e => toast('No se pudo abrir ' + app.name)); }
    catch (e) { toast('No se pudo abrir ' + app.name); }
  } else {
    toast('Abriendo ' + app.name);
  }
}
function toggleFav(app) {
  const i = favs.indexOf(app.id);
  if (i >= 0) { favs.splice(i, 1); toast(app.name + ' quitado de favoritos'); }
  else { favs.push(app.id); toast(app.name + ' añadido a favoritos'); }
  saveFavs();
  if (focus.r === 0 && !favs.length) focus = { r: 1, c: 0 };
  render();
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function move(dr, dc) {
  let { r, c } = focus;
  if (dc) {
    if (r === 1) {
      // en la cuadrícula, izquierda/derecha se queda en la misma línea
      const perRow = Math.max(1, Math.floor((1920 - 240 + 28) / (254 + 28)));
      const nc = c + dc;
      if (nc < 0 || nc >= rows[1].length || Math.floor(nc / perRow) !== Math.floor(c / perRow)) return;
      c = nc;
    } else {
      c = Math.max(0, Math.min(rows[0].length - 1, c + dc));
    }
  } else {
    const perRow = Math.max(1, Math.floor((1920 - 240 + 28) / (254 + 28)));
    if (r === 0 && dr > 0) {
      // columna visual de la tile del dock → misma zona de la primera línea de la cuadrícula
      const favRow = document.getElementById('favRow');
      const shift = -(new DOMMatrix(getComputedStyle(favRow).transform).m41 || 0);
      const xCenter = 92 + 28 + c * (306 + 28) + 153 - shift;
      const col = Math.max(0, Math.min(perRow - 1, Math.floor((xCenter - 120) / (254 + 28))));
      r = 1; c = Math.min(col, rows[1].length - 1);
    }
    else if (r === 1 && dr < 0) {
      if (c < perRow) { if (!rows[0].length) return; r = 0; c = Math.min(c, rows[0].length - 1); }
      else c -= perRow;
    } else if (r === 1 && dr > 0) {
      if (c + perRow < rows[1].length) c += perRow;
      else if (Math.floor(c / perRow) < Math.floor((rows[1].length - 1) / perRow)) c = rows[1].length - 1;
      else return;
    } else return;
  }
  focus = { r, c };
  paint();
}

/* ---------- mando: pulsación corta abre, larga fija ---------- */
let holdTimer = null, held = false;
const ENTER = 13, BACK = 10009, YELLOW = 405;
addEventListener('keydown', e => {
  const k = e.keyCode;
  const app = rows[focus.r][focus.c];
  if (k === 37) { move(0, -1); e.preventDefault(); }
  else if (k === 39) { move(0, 1); e.preventDefault(); }
  else if (k === 38) { move(-1, 0); e.preventDefault(); }
  else if (k === 40) { move(1, 0); e.preventDefault(); }
  else if (k === ENTER) {
    e.preventDefault();
    if (holdTimer || !app) return; // ignorar autorrepetición
    held = false;
    const t = els.get(focus.r + ':' + focus.c);
    t && t.classList.add('holding');
    holdTimer = setTimeout(() => { held = true; t && t.classList.remove('holding'); toggleFav(app); }, 600);
  }
  else if (k === YELLOW && app) { toggleFav(app); e.preventDefault(); }
  else if (k === BACK) { e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (e.keyCode !== ENTER) return;
  clearTimeout(holdTimer); holdTimer = null;
  els.forEach(t => t.classList.remove('holding'));
  if (!held) { const app = rows[focus.r][focus.c]; app && launch(app); }
});

/* ---------- reloj ---------- */
function tick() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  document.getElementById('clock').innerHTML = hh + '<span class="sep">:</span>' + mm;
  document.getElementById('date').textContent =
    d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  const h = d.getHours();
  document.getElementById('hello').textContent =
    h < 6 ? 'Buenas noches, Jairo' : h < 14 ? 'Buenos días, Jairo' : h < 21 ? 'Buenas tardes, Jairo' : 'Buenas noches, Jairo';
}
tick(); setInterval(tick, 10000);

/* ---------- arranque ---------- */
try {
  if (window.tizen && tizen.tvinputdevice) tizen.tvinputdevice.registerKey('ColorF2Yellow');
} catch (e) {}

discover().then(list => {
  apps = (list && list.length ? list : PREVIEW).sort((a, b) => a.name.localeCompare(b.name, 'es'));
  favs = loadFavs(apps);
  render();
});
</script>
